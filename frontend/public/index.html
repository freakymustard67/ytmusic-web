<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="A web front-end for YouTube Music: search, play songs and videos, synced lyrics." />
    <title>Music</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand" id="homeBtn" title="Home">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          <span>Music</span>
        </div>
        <form class="search" id="searchForm" role="search">
          <input id="q" type="search" placeholder="Search songs, videos, artists…" autocomplete="off" spellcheck="false" />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          </button>
        </form>
        <nav class="tabs" id="tabs">
          <button data-tab="songs" class="active">Songs</button>
          <button data-tab="videos">Videos</button>
          <button data-tab="albums">Albums</button>
          <button data-tab="artists">Artists</button>
          <button data-tab="playlists">Playlists</button>
        </nav>
        <button class="ghost" id="queueBtn" title="Queue">Queue <span id="queueCount">0</span></button>
      </header>

      <main id="main" class="main">
        <section class="empty" id="welcome">
          <h1>Search YouTube Music</h1>
          <p>Play songs and videos, with time-synced lyrics. Install it from your browser menu to use it like an app.</p>
          <div class="chips" id="chips"></div>
        </section>
        <section class="results" id="results" hidden></section>
      </main>

      <aside class="queuePanel" id="queuePanel" hidden>
        <header><strong>Queue</strong><button class="ghost" id="queueClose">Close</button></header>
        <ol id="queueList"></ol>
      </aside>

      <section class="lyricsOverlay" id="lyricsOverlay" hidden>
        <header>
          <strong id="lyricsTitle">Lyrics</strong>
          <span id="lyricsSource" class="muted"></span>
          <button class="ghost" id="lyricsClose">Close</button>
        </header>
        <div class="lyricsBody" id="lyricsBody"></div>
      </section>

      <footer class="player" id="player">
        <div class="nowPlaying">
          <img id="art" alt="" />
          <div class="npText">
            <div id="npTitle" class="npTitle">Nothing playing</div>
            <div id="npArtist" class="npArtist">Pick a song to start</div>
          </div>
          <button class="icon" id="likeBtn" title="Download for offline" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM12 18l5-5h-3V4h-4v9H7l5 5z"/></svg>
          </button>
        </div>

        <div class="controls">
          <div class="buttons">
            <button class="icon" id="shuffleBtn" title="Shuffle"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
            <button class="icon" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
            <button class="icon play" id="playBtn" title="Play/Pause"><svg viewBox="0 0 24 24" width="24" height="24"><path id="playPath" fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
            <button class="icon" id="nextBtn" title="Next"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            <button class="icon" id="repeatBtn" title="Repeat"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
            <button class="icon" id="lyricsBtn" title="Lyrics"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg></button>
          </div>
          <div class="seekRow">
            <span id="curTime" class="time">0:00</span>
            <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
            <span id="durTime" class="time">0:00</span>
            <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume" />
          </div>
        </div>
      </footer>
    </div>

    <div id="toast" class="toast" hidden></div>
    <audio id="audio" preload="auto" crossorigin="anonymous"></audio>
    <script type="module" src="/app.js"></script>
  </body>
</html>
